name: ルート設定・一覧

# Actions タブ →「ルート設定・一覧」→ Run workflow で、プルダウンから選んで実行します。
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "操作"
        type: choice
        default: 一覧を見る（登録中のルート）
        options:
          - 一覧を見る（登録中のルート）
          - 一覧を見る（選んだエリア）
          - 追加
          - 削除
          - この1件だけにする
          - 確認だけ
      start:
        description: "出発エリア"
        type: choice
        default: 関東
        options: [どこでも, 北海道, 東北, 関東, 中部, 近畿, 中国, 四国, 九州]
      dest:
        description: "返却エリア"
        type: choice
        default: どこでも
        options: [どこでも, 北海道, 東北, 関東, 中部, 近畿, 中国, 四国, 九州]

permissions:
  contents: write

concurrency:
  group: katamichi-check
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ルート変更・一覧の通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python notifier.py --route "${{ inputs.operation }}" "${{ inputs.start }}" "${{ inputs.dest }}"

      - name: 保存
        if: ${{ !startsWith(inputs.operation, '一覧') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --cached --quiet || (git commit -m "ルート設定: ${{ inputs.operation }} ${{ inputs.start }}→${{ inputs.dest }}" && git push)
