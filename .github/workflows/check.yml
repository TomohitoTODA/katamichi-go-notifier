name: 片道GO! 新着チェック

on:
  schedule:
    # 日本時間 6:00〜23:30 の30分おき（GitHubの時刻はUTCなので -9時間で指定）
    # ※GitHubの混雑で数分〜十数分遅れることがあります
    - cron: "*/30 21-23,0-14 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知だけ送る"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: katamichi-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: チェックして通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ROUTES: ${{ vars.ROUTES }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python notifier.py --test
          else
            python notifier.py
          fi

      - name: 既読リストを保存
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "既読リストを更新" && git push)
